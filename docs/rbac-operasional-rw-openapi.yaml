        '
      responses: *id001
  /api/v1/notifications/manual:
    post:
      tags:
      - auth
      summary: Send manual push notification
      security:
      - BearerAuth: []
      description: 'Requires Pengurus role. Manual push to selected recipients.

        '
      responses: *id001
  /health:
    get:
      tags:
      - health
      summary: Health check
      description: Unauthenticated. Returns 200 with status and database name.
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
  /__test__/info:
    get:
      tags:
      - health
      summary: Test environment info (E2E test only)
      description: 'Returns app environment and current database name.

        Used by E2E tests to verify test DB isolation.

        '
      responses:
        '200':
          description: Test info
  /__test__require_role_bendahara:
    get:
      tags:
      - health
      summary: Test RequireRole(bendahara) middleware
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Auth context with tenant role
  /__test__require_system_admin:
    get:
      tags:
      - health
      summary: Test RequireSystemRole(super_admin) middleware
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Auth context with system role
  /__test/override/query:
    get:
      tags:
      - health
      summary: Test tenant override (verify client rt_id is ignored)
      security:
      - BearerAuth: []
      parameters:
      - name: rt_id
        in: query
        schema:
          type: string
      - name: membership_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Shows auth context vs client-provided values
  /__test__/override/*:
    get:
      tags:
      - health
      summary: Test tenant override via path param
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Shows auth context vs client path values
  /api/v1/residents/{id}/move:
    post:
      tags:
      - finance-write
      summary: Move resident to different household
      security:
      - BearerAuth: []
      description: Requires `warga.update` permission.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '500':
          description: Internal server error
  /api/v1/categories/{id}:
    delete:
      tags:
      - finance-write
      summary: Deactivate category (pengurus only)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Soft delete via is_active = false.
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '500':
          description: Internal server error
    patch:
      tags:
      - finance-write
      summary: Update category (pengurus only)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '500':
          description: Internal server error
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT token with claims:

        - sub: user ID (UUID)

        - role: tenant role (warga, bendahara, pengurus)

        - rt_id: tenant ID (NULL for super_admin)

        - rw_context: JSON array of RW membership objects (RWID + jabatan)

        - sys_role: system role (super_admin) or NULL

        '
  schemas:
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: SecurePass123!
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Short-lived JWT (15 minutes)
        refresh_token:
          type: string
          description: Opaque refresh token, stored server-side as hash
        token_type:
          type: string
          example: Bearer
    RefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          pattern: ^\+?[0-9]{8,15}$
    ChangePasswordRequest:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
    UserProfile:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        rt_id:
          type: string
          format: uuid
          nullable: true
          description: Tenant ID from JWT (NULL for super_admin)
        role:
          type: string
          enum:
          - warga
          - bendahara
          - pengurus
        rw_memberships:
          type: array
          nullable: true
          description: RW memberships from JWT (loaded via loadRWMemberships)
          items:
            $ref: '#/components/schemas/RWMembership'
    RW:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rw_number:
          type: integer
          description: RW number (e.g., 1, 2, 16)
        name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateRWRequest:
      type: object
      required:
      - rw_number
      - name
      properties:
        rw_number:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 100
    UpdateRWRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
    RWMembership:
      type: object
      properties:
        membership_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        rw_id:
          type: string
          format: uuid
        jabatan:
          type: string
          enum:
          - ketua
          - wakil_ketua
          - sekretaris
          - bendahara
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    SetRWJabatanRequest:
      type: object
      required:
      - jabatan
      properties:
        jabatan:
          type: string
          enum:
          - ketua
          - wakil_ketua
          - sekretaris
          - bendahara
    RT:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rw_id:
          type: string
          format: uuid
        rt:
          type: integer
          description: RT number (e.g., 1, 2, 21)
        name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateRTRequest:
      type: object
      required:
      - rw_id
      - rt
      properties:
        rw_id:
          type: string
          format: uuid
        rt:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 100
    CreateHouseholdRequest:
      type: object
      required:
      - rt_id
      - address
      - house_number
      - owner_name
      properties:
        rt_id:
          type: string
          format: uuid
        address:
          type: string
        house_number:
          type: string
        owner_name:
          type: string
        owner_nik:
          type: string
          pattern: ^[0-9]{16}$
        owner_phone:
          type: string
    CreateResidentRequest:
      type: object
      properties:
        household_id:
          type: string
          format: uuid
        name:
          type: string
        nik:
          type: string
          pattern: ^[0-9]{16}$
        phone:
          type: string
        relationship:
          type: string
        gender:
          type: string
          enum:
          - male
          - female
        birth_date:
          type: string
          format: date
        occupation:
          type: string
        education:
          type: string
    CreatePaymentRequest:
      type: object
      required:
      - bill_id
      - amount
      - payment_method
      properties:
        bill_id:
          type: string
          format: uuid
        amount:
          type: string
          description: Fixed-precision decimal as string (e.g., '50000')
          example: '50000'
        payment_method:
          type: string
        note:
          type: string
    CreateMultiPeriodPaymentRequest:
      type: object
      required:
      - bill_ids
      - amount
      - payment_method
      properties:
        bill_ids:
          type: array
          items:
            type: string
            format: uuid
        amount:
          type: string
        payment_method:
          type: string
        note:
          type: string
    VerifyPaymentRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - approve
          - reject
          description: Must be lowercase 'approve' or 'reject'. 'APPROVED' (with -D) will be rejected with 400.
        note:
          type: string
    CreateDueRequest:
      type: object
      required:
      - rt_id
      - category_id
      - name
      - amount
      properties:
        rt_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        name:
          type: string
        amount:
          type: string
        description:
          type: string
    UpdateDueStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - active
          - archived
    UpdateBillStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - pending
          - paid
          - overdue
          - cancelled
    GenerateBillsRequest:
      type: object
      required:
      - due_id
      - period_month
      - period_year
      - household_ids
      properties:
        due_id:
          type: string
          format: uuid
        period_month:
          type: integer
        period_year:
          type: integer
        household_ids:
          type: array
          items:
            type: string
            format: uuid
    CreateTransactionRequest:
      type: object
      required:
      - type
      - amount
      - category_id
      - description
      properties:
        type:
          type: string
          enum:
          - income
          - expense
          description: Always positive. Use type instead of negative amounts.
        amount:
          type: string
          description: Fixed-precision decimal as string (e.g., '50000')
        category_id:
          type: string
          format: uuid
        description:
          type: string
        date:
          type: string
          format: date
        reference_no:
          type: string
        rt_id:
          type: string
          format: uuid
          nullable: true
          description: Derived from JWT. NOT from request body.
      example:
        type: income
        amount: '50000'
        category_id: a3a3a3a3-a3a3-a3a3-a3a3-a3a3a3a3a3a3
        description: Iuran bulanan Oktober
        date: '2026-10-01'
    BalanceReport:
      type: object
      properties:
        period:
          type: string
          description: YYYY-MM format
        opening_balance:
          type: string
          description: Fixed-precision decimal as string
        total_income:
          type: string
          description: Sum of all posted income
        total_expense:
          type: string
          description: Sum of all posted expense
        closing_balance:
          type: string
          description: opening + income - expense
        computed_from:
          type: string
          description: Calculated from ledger, never stored
    SetOpeningBalanceRequest:
      type: object
      required:
      - amount
      - period
      properties:
        amount:
          type: string
          description: Fixed-precision decimal as string
        period:
          type: string
          description: YYYY-MM
    FundLocation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rt_id:
          type: string
          format: uuid
        name:
          type: string
          description: e.g., 'Rekening Bank BRI', 'Brankas RT'
        location_type:
          type: string
          enum:
          - rekening
          - brankas
          - coh
        account_number:
          type: string
          nullable: true
        bank_name:
          type: string
          nullable: true
        is_active:
          type: boolean
        opening_balance:
          type: string
          nullable: true
        current_balance:
          type: string
          description: Calculated from transactions, never stored
        created_at:
          type: string
          format: date-time
    CreateFundLocationRequest:
      type: object
      required:
      - rt_id
      - name
      - location_type
      properties:
        rt_id:
          type: string
          format: uuid
        name:
          type: string
        location_type:
          type: string
          enum:
          - rekening
          - brankas
          - coh
        account_number:
          type: string
        bank_name:
          type: string
        opening_balance:
          type: string
    CreateTransferRequest:
      type: object
      required:
      - from_location_id
      - to_location_id
      - amount
      - description
      properties:
        from_location_id:
          type: string
          format: uuid
        to_location_id:
          type: string
          format: uuid
        amount:
          type: string
          description: Always positive
        description:
          type: string
        date:
          type: string
          format: date
    ReconciliationReport:
      type: object
      properties:
        location_id:
          type: string
          format: uuid
        ledger_total:
          type: string
        reported_balance:
          type: string
        difference:
          type: string
        status:
          type: string
          enum:
          - matched
          - unmatched
    RegisterDeviceRequest:
      type: object
      required:
      - device_token
      - platform
      properties:
        device_token:
          type: string
        platform:
          type: string
          enum:
          - android
          - ios
          - web
        device_model:
          type: string
        app_version:
          type: string
    CreateNotificationTemplateRequest:
      type: object
      required:
      - name
      - system_type
      properties:
        name:
          type: string
        system_type:
          type: string
        subject:
          type: string
        body:
          type: string
        variables:
          type: array
          items:
            type: string
          example:
          - '{{name}}'
          - '{{amount}}'
          - '{{period}}'
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: validation_error
            message:
              type: string
              description: Human-readable error message
              example: Invalid request body
            details:
              type: array
              description: Detailed validation errors (if any)
              items:
                type: object
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        total_pages:
          type: integer
          example: 5
    RWDashboardSummary:
      type: object
      description: 'Aggregated financial overview for the RW scope (all RTs in the RW).
        All monetary values are fixed-precision strings.'
      properties:
        total_rts:
          type: integer
          description: Number of active RTs in this RW
        total_locations:
          type: integer
          description: Number of fund locations across all RTs
        total_balance:
          type: string
          description: 'Net balance across all RT locations. Computed as: SUM(locations.current_balance).'
        total_income:
          type: string
          description: 'Sum of all posted income transactions across all RTs.'
        total_expense:
          type: string
          description: 'Sum of all posted expense transactions across all RTs.'
        transaction_count:
          type: integer
          description: Total number of posted transactions across all RTs
    KASReport:
      type: object
      description: 'RW-level KAS report (income minus expense).
        Aggregated from all RTs in the RW.
        All monetary values are fixed-precision strings.'
      properties:
        total_income:
          type: string
          description: 'Sum of all posted income transactions across all RTs.'
        total_expense:
          type: string
          description: 'Sum of all posted expense transactions across all RTs.'
        net_balance:
          type: string
          description: 'total_income minus total_expense.'
        transaction_count:
          type: integer
          description: Total number of posted transactions across all RTs
    TransactionEntry:
      type: object
      description: 'Single posted transaction from an RT within the RW.
        Transaction data is sourced from the RT-level transactions table,
        joined with rts.rw_id for RW-scoped access.'
      properties:
        id:
          type: string
          format: uuid
        rt_id:
          type: string
          format: uuid
          description: The RT this transaction belongs to
        rt_name:
          type: string
          description: The RT name for identification
        type:
          type: string
          enum:
          - income
          - expense
          description: Always positive. Use type instead of negative amounts.
        amount:
          type: string
          description: Fixed-precision decimal as string (always positive)
        description:
          type: string
        category_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
          - posted
        payment_id:
          type: string
          format: uuid
          nullable: true
        occurred_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    FundLocationSummary:
      type: object
      description: 'Read-only fund location from an RT within the RW.
        Includes current balance derived from location_balance_changes.'
      properties:
        id:
          type: string
          format: uuid
        rt_id:
          type: string
          format: uuid
          description: The RT this location belongs to
        rt_name:
          type: string
          description: The RT name for identification
        name:
          type: string
          description: e.g., 'Rekening Bank BRI', 'Brankas RT'
        category:
          type: string
          description: e.g., 'bank_account', 'cash'
        bank_name:
          type: string
          nullable: true
        account_number:
          type: string
          nullable: true
        account_holder:
          type: string
          nullable: true
        is_active:
          type: boolean
        current_balance:
          type: string
          description: 'Calculated balance: SUM(location_balance_changes.amount_delta) + opening_balance'
        created_at:
          type: string
          format: date-time
