openapi: 3.0.3
info:
  title: Social Finance API — RBAC Operasional RW
  version: 1.0.0
  description: 'Kontrak API untuk Social Finance Urena, mencakup endpoint yang sudah terimplementasi

    dan endpoint operasional RW yang masih direncanakan (PLANNED — NOT IMPLEMENTED).


    Endpoint RW operasional (KAS RW, Beranda RW, Lokasi Dana RW) belum tersedia.

    Middleware `RequireRWScope()` dan handler `checkRWBendaharaAccess()` sudah ada

    di codebase tapi belum terhubung ke endpoint manapun.


    Dokumentasi ini dibuat dari inspeksi source code aktual di router `buildRouter()`,

    handler `internal/finance/`, `internal/fund_location/`, `internal/auth/`,

    dan `internal/rt/`.

    '
  contact:
    name: Social Finance Team
servers:
- url: /api/v1
  description: Base path untuk semua endpoint
tags:
- name: auth
  description: Otentikasi dan manajemen sesi
- name: rt-admin
  description: Manajemen RT (SUPER_ADMIN only)
- name: rw-admin
  description: Manajemen RW (SUPER_ADMIN only)
- name: finance-read
  description: Baca data keuangan (warga, bendahara, pengurus)
- name: finance-write
  description: Operasional keuangan (bendahara, pengurus)
- name: fund-location
  description: Manajemen lokasi dana RT
- name: rw-operational
  description: Operasional read-only RW (aggregate dari semua RT dalam RW). Accessible by pengurus.
- name: health
  description: Health check endpoint
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Authenticate user (login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: SecurePass123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request body (missing email/password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited (too many login attempts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout (invalidate refresh token)
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Get current user profile
      security:
      - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/profile:
    put:
      tags:
      - auth
      summary: Update user profile
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/password:
    put:
      tags:
      - auth
      summary: Change password
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/rws:
    get:
      tags:
      - rw-admin
      summary: List all RW organizations (SUPER_ADMIN)
      security:
      - BearerAuth: []
      description: 'Returns all RW records. Only accessible by SUPER_ADMIN.

        No `rt_id` filter — system-wide scope.

        '
      responses:
        '200':
          description: RW list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RW'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (not SUPER_ADMIN)
    post:
      tags:
      - rw-admin
      summary: Create a new RW organization (SUPER_ADMIN)
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRWRequest'
      responses:
        '201':
          description: RW created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RW'
        '400':
          description: Invalid input
        '403':
          description: Forbidden
        '409':
          description: RW number already exists
  /api/v1/rws/{id}:
    get:
      tags:
      - rw-admin
      summary: Get RW by ID (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: RW details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RW'
        '404':
          description: RW not found
    patch:
      tags:
      - rw-admin
      summary: Update RW (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRWRequest'
      responses:
        '200':
          description: RW updated
        '400':
          description: Invalid input
        '404':
          description: RW not found
  /api/v1/rws/{id}/deactivate:
    patch:
      tags:
      - rw-admin
      summary: Deactivate RW (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: RW deactivated
        '404':
          description: RW not found
  /api/v1/rws/{id}/memberships:
    get:
      tags:
      - rw-admin
      summary: List RW memberships (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Membership list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RWMembership'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
  /api/v1/rws/{id}/memberships/{userId}/jabatan:
    put:
      tags:
      - rw-admin
      summary: Set RW jabatan for user (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRWJabatanRequest'
      responses:
        '200':
          description: Jabatan set
        '400':
          description: Invalid jabatan
        '409':
          description: Already assigned
    delete:
      tags:
      - rw-admin
      summary: Remove RW jabatan for user (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Jabatan removed
  /api/v1/rts:
    get:
      tags:
      - rt-admin
      summary: List all RTs (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: rw_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: RT list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RT'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      tags:
      - rt-admin
      summary: Create a new RT (SUPER_ADMIN)
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRTRequest'
      responses:
        '201':
          description: RT created
  /api/v1/rts/{id}:
    get:
      tags:
      - rt-admin
      summary: Get RT by ID (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: RT details
        '404':
          description: RT not found
    patch:
      tags:
      - rt-admin
      summary: Update RT (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: RT updated
  /api/v1/rts/{id}/deactivate:
    patch:
      tags:
      - rt-admin
      summary: Deactivate RT (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: RT deactivated
  /api/v1/rts/{id}/memberships:
    get:
      tags:
      - rt-admin
      summary: List RT memberships (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Membership list
  /api/v1/rts/{id}/memberships/{userId}/jabatan:
    put:
      tags:
      - rt-admin
      summary: Set RT jabatan for user (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Jabatan set
    delete:
      tags:
      - rt-admin
      summary: Remove RT jabatan for user (SUPER_ADMIN)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Jabatan removed
  /api/v1/rw/{rwId}/dashboard:
    get:
      tags:
      - rw-operational
      summary: Get RW dashboard (read-only)
      security:
      - BearerAuth: []
      description: 'Aggregates financial overview from all RTs within the RW.
        Requires RW membership (verified via RequireRWScope middleware).
        Returns total RTs, locations, balance, income, expense, transaction count.
        '
      parameters:
      - name: rwId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: RW dashboard summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RWDashboardSummary'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (no RW membership or RW not found)
  /api/v1/rw/{rwId}/kas:
    get:
      tags:
      - rw-operational
      summary: Get RW KAS report (read-only)
      security:
      - BearerAuth: []
      description: 'Aggregates income/expense KAS from all RTs within the RW.
        Optional period filter (YYYY-MM) limits to posted transactions in that month.
        Net balance is income minus expense.
        '
      parameters:
      - name: rwId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: period
        in: query
        required: false
        schema:
          type: string
          pattern: '^\\d{4}-\\d{2}$'
        description: 'Filter by month (YYYY-MM). If omitted, returns all-time totals.'
      responses:
        '200':
          description: KAS report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/KASReport'
        '400':
          description: Invalid period format
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (no RW membership or RW not found)
  /api/v1/rw/{rwId}/kas/transactions:
    get:
      tags:
      - rw-operational
      summary: Get RW KAS transactions (read-only)
      security:
      - BearerAuth: []
      description: 'Lists posted transactions from all RTs within the RW.
        Supports filtering by period (YYYY-MM), start_date, and end_date.
        Returns paginated results ordered by occurred_at DESC.
        '
      parameters:
      - name: rwId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: period
        in: query
        required: false
        schema:
          type: string
          pattern: '^\\d{4}-\\d{2}$'
        description: 'Filter by month (YYYY-MM).'
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Filter transactions on or after this date (YYYY-MM-DD).'
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Filter transactions on or before this date (YYYY-MM-DD).'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionEntry'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Invalid query parameter
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (no RW membership or RW not found)
  /api/v1/rw/{rwId}/locations:
    get:
      tags:
      - rw-operational
      summary: Get RW fund locations (read-only)
      security:
      - BearerAuth: []
      description: 'Lists all fund locations from all RTs within the RW.
        Includes current balance derived from location_balance_changes.
        '
      parameters:
      - name: rwId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
        description: 'Filter by active status. If omitted, returns all locations.'
      responses:
        '200':
          description: Fund locations list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundLocationSummary'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (no RW membership or RW not found)
  /api/v1/households:
    get:
      tags:
      - finance-read
      summary: List households (warga, bendahara, pengurus)
      security:
      - BearerAuth: []
      description: 'Tenant-scoped via JWT `rt_id`. Accessible by warga, bendahara, pengurus.

        Requires `warga.read` permission (checked via `position_permissions` for jabatan-based users).

        '
      responses:
        '200':
          description: Household list
        '403':
          description: Forbidden
    post:
      tags:
      - finance-write
      summary: Create household (pengurus, bendahara)
      security:
      - BearerAuth: []
      description: 'Requires `warga.create` permission AND role/jabatan check.

        Both role-based (Pengurus, Bendahara) and jabatan-based (Ketua, Wakil Ketua, Sekretaris, Bendahara) allowed.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseholdRequest'
      responses:
        '201':
          description: Household created
        '403':
          description: Forbidden
  /api/v1/households/{id}:
    get:
      tags:
      - finance-read
      summary: Get household by ID
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Household details
        '404':
          description: Not found
    patch:
      tags:
      - finance-write
      summary: Update household
      security:
      - BearerAuth: []
      description: Requires `warga.update` permission.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Updated
        '403':
          description: Forbidden
    delete:
      tags:
      - finance-write
      summary: Deactivate household (soft delete)
      security:
      - BearerAuth: []
      description: Requires `warga.update` permission.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Deactivated
  /api/v1/households/{id}/move:
    post:
      tags:
      - finance-write
      summary: Move household to different RT
      security:
      - BearerAuth: []
      description: Requires `warga.update` permission.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Moved
  /api/v1/residents:
    get:
      tags:
      - finance-read
      summary: List residents
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Resident list
    post:
      tags:
      - finance-write
      summary: Create resident
      security:
      - BearerAuth: []
      description: Requires `warga.create` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResidentRequest'
      responses:
        '201':
          description: Resident created
  /api/v1/residents/{id}:
    get:
      tags:
      - finance-read
      summary: Get resident by ID
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses: &id001
        '200':
          description: OK
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '500':
          description: Internal server error
    patch:
      tags:
      - finance-write
      summary: Update resident
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Requires `warga.update` permission.
      responses: *id001
    delete:
      tags:
      - finance-write
      summary: Deactivate resident (soft delete)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses: *id001
  /api/v1/residents/special:
    post:
      tags:
      - finance-write
      summary: Create special resident (not affiliated with a household)
      security:
      - BearerAuth: []
      description: Requires `warga.create` permission.
      responses: *id001
  /api/v1/residents/special/{id}:
    patch:
      tags:
      - finance-write
      summary: Update special resident
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses: *id001
  /api/v1/warga/export:
    get:
      tags:
      - finance-read
      summary: Export warga data as CSV
      security:
      - BearerAuth: []
      description: Warga-exportable CSV download.
      responses: *id001
  /api/v1/warga/template:
    get:
      tags:
      - finance-read
      summary: Download warga import template
      security:
      - BearerAuth: []
      description: 'XLSX template for warga import. Requires `warga.export` permission

        AND role/jabatan check (Pengurus, Bendahara, Ketua, Wakil Ketua).

        '
      responses: *id001
  /api/v1/warga/export/xlsx:
    get:
      tags:
      - finance-read
      summary: Export warga data as XLSX
      security:
      - BearerAuth: []
      description: 'XLSX export. Requires `warga.export` permission.

        '
      responses: *id001
  /api/v1/warga/import/preview:
    post:
      tags:
      - finance-write
      summary: Preview warga import from JSON
      security:
      - BearerAuth: []
      description: 'Preview parsed warga data before commit.

        Requires `warga.create`, `warga.update`, and `warga.import` permissions.

        '
      responses: *id001
  /api/v1/warga/import/commit:
    post:
      tags:
      - finance-write
      summary: Commit warga import from JSON
      security:
      - BearerAuth: []
      description: 'Commit parsed warga data.

        Requires `warga.create`, `warga.update`, and `warga.import` permissions.

        '
      responses: *id001
  /api/v1/warga/import/preview/xlsx:
