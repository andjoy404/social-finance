name: social_finance
description: "Social Finance - Social Finance for Your Neighborhood"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # HTTP client (reserved for future backend integration)
  dio: ^5.8.0+1

  # Utilities
  intl: ^0.20.2
  fl_chart: ^0.69.0
  image_picker: ^1.2.4
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  uuid: ^4.5.1

  # PDF generation
  pdf: ^3.11.3
  printing: ^5.13.4

  # Excel generation
  excel: ^4.0.6

  # File system access
  file: ^7.0.0

  # Save file to device storage
  file_saver: ^0.7.0

  # Firebase Push Notifications
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

  riverpod_generator: ^2.6.4
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logo_launcher.png
    - assets/images/logo_animated.gif

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo_launcher.png"
  adaptive_icon_background: "#101336"
  adaptive_icon_foreground: "assets/images/logo_launcher.png"
  adaptive_icon_foreground_inset: 4
