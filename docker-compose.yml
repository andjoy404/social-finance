services:
  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: social-finance-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - ${FCM_CREDENTIALS_FILE:-./secret/fcm-service-account.json}:/run/secrets/fcm-service-account.json:ro
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - HTTP_PORT=${HTTP_PORT:-8080}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-social_finance}
      - DB_USER=${DB_USER:-social_finance}
      - DB_PASSWORD=${DB_PASSWORD:-social_finance_dev_password}
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-900}
      - REFRESH_EXPIRY=${REFRESH_EXPIRY:-604800}
      - BOOTSTRAP_EMAIL=${BOOTSTRAP_EMAIL}
      - BOOTSTRAP_PASSWORD=${BOOTSTRAP_PASSWORD}
      - BOOTSTRAP_NAME=${BOOTSTRAP_NAME:-Super Admin}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT:-rustfs:9000}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin123}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-social-finance-payment-proofs}
      - RUSTFS_USE_SSL=${RUSTFS_USE_SSL:-false}
      - FCM_CREDENTIALS_FILE=/run/secrets/fcm-service-account.json
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-social-finance-andjoy}
      - FCM_CREDENTIALS=${FCM_CREDENTIALS:-}
      - TZ=Asia/Jakarta
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    networks:
      - social-finance-internal

  backend-test:
    restart: unless-stopped
    profiles:
      - test
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: social-finance-backend-test
    working_dir: /app
    volumes:
      - ./backend:/app
      - ${FCM_CREDENTIALS_FILE:-./secret/social-finance-andjoy-93df7226d69d.json}:/run/secrets/fcm-service-account.json:ro
    ports:
      - "8082:8080"
    environment:
      - APP_ENV=test
      - HTTP_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=social_finance_test
      - DB_USER=${DB_USER:-social_finance}
      - DB_PASSWORD=${DB_PASSWORD:-social_finance_dev_password}
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-900}
      - REFRESH_EXPIRY=${REFRESH_EXPIRY:-604800}
      - BOOTSTRAP_EMAIL=${BOOTSTRAP_EMAIL}
      - BOOTSTRAP_PASSWORD=${BOOTSTRAP_PASSWORD}
      - BOOTSTRAP_NAME=${BOOTSTRAP_NAME:-Super Admin}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT:-rustfs:9000}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin123}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-social-finance-payment-proofs}
      - RUSTFS_USE_SSL=${RUSTFS_USE_SSL:-false}
      - FCM_CREDENTIALS_FILE=/run/secrets/fcm-service-account.json
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-social-finance-andjoy}
      - FCM_CREDENTIALS=${FCM_CREDENTIALS:-}
      - TZ=Asia/Jakarta
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - social-finance-internal

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: social-finance-postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-social_finance}
      - POSTGRES_USER=${DB_USER:-social_finance}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-social_finance_dev_password}
      - TZ=Asia/Jakarta
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sh:/docker-entrypoint-initdb.d/01-init-test-db.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - social-finance-internal

  rustfs:
    restart: unless-stopped
    image: rustfs/rustfs:latest
    container_name: social-finance-rustfs
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin123}
      - RUSTFS_ROOT_USER=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_SECRET_KEY:-rustfsadmin123}
      - MINIO_ROOT_USER=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - MINIO_ROOT_PASSWORD=${RUSTFS_SECRET_KEY:-rustfsadmin123}
      - TZ=Asia/Jakarta
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - social-finance-internal

  rustfs-init:
    restart: "no"
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: social-finance-rustfs-init
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-social_finance}
      - DB_USER=${DB_USER:-social_finance}
      - DB_PASSWORD=${DB_PASSWORD:-social_finance_dev_password}
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT:-rustfs:9000}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfsadmin123}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET:-social-finance-payment-proofs}
      - RUSTFS_USE_SSL=${RUSTFS_USE_SSL:-false}
      - TZ=Asia/Jakarta
    command: ["/tmp/build/api", "--init-storage"]
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - social-finance-internal

  migrate:
    restart: "no"
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    container_name: social-finance-migrate
    environment:
      - DB_USER=${DB_USER:-social_finance}
      - DB_PASSWORD=${DB_PASSWORD:-social_finance_dev_password}
      - DB_NAME=${DB_NAME:-social_finance}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - TZ=Asia/Jakarta
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    networks:
      - social-finance-internal

  seed:
    restart: "no"
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: social-finance-seed
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-social_finance}
      - DB_USER=${DB_USER:-social_finance}
      - DB_PASSWORD=${DB_PASSWORD:-social_finance_dev_password}
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
      - TZ=Asia/Jakarta
    command: ["/tmp/build/api", "--seed-dev"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - social-finance-internal

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: social-finance-frontend
    environment:
      - TZ=Asia/Jakarta
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - social-finance-internal

volumes:
  postgres_data:
  rustfs_data:

networks:
  social-finance-internal:
    driver: bridge
