services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: social-finance-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - HTTP_PORT=${HTTP_PORT:-8080}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-social_finance}
      - DB_USER=${DB_USER:-social_finance}
      - DB_PASSWORD=${DB_PASSWORD:-social_finance_dev_password}
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-900}
      - REFRESH_EXPIRY=${REFRESH_EXPIRY:-604800}
      - BOOTSTRAP_EMAIL=${BOOTSTRAP_EMAIL}
      - BOOTSTRAP_PASSWORD=${BOOTSTRAP_PASSWORD}
      - BOOTSTRAP_NAME=${BOOTSTRAP_NAME:-Super Admin}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - social-finance-internal

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: social-finance-backend-test
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8082:8080"
    environment:
      - APP_ENV=test
      - HTTP_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=social_finance_test
      - DB_USER=${DB_USER:-social_finance}
      - DB_PASSWORD=${DB_PASSWORD:-social_finance_dev_password}
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-900}
      - REFRESH_EXPIRY=${REFRESH_EXPIRY:-604800}
      - BOOTSTRAP_EMAIL=${BOOTSTRAP_EMAIL}
      - BOOTSTRAP_PASSWORD=${BOOTSTRAP_PASSWORD}
      - BOOTSTRAP_NAME=${BOOTSTRAP_NAME:-Super Admin}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - social-finance-internal

  postgres:
    image: postgres:16-alpine
    container_name: social-finance-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-social_finance}
      POSTGRES_USER: ${DB_USER:-social_finance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-social_finance_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - social-finance-internal

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    container_name: social-finance-migrate
    environment:
      - DB_USER=${DB_USER:-social_finance}
      - DB_PASSWORD=${DB_PASSWORD:-social_finance_dev_password}
      - DB_NAME=${DB_NAME:-social_finance}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    networks:
      - social-finance-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: social-finance-frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - social-finance-internal

volumes:
  postgres_data:

networks:
  social-finance-internal:
    driver: bridge
