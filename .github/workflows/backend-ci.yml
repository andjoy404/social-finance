name: Backend CI

# TEMPORARILY DISABLED: automatic push/pull_request triggers.
# Restore the previous path-filtered triggers when CI is re-enabled.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Quality gates
        run: |
          echo "=== vet ==="
          go vet ./...
          echo "=== test ==="
          go test ./...
          echo "=== race test ==="
          go test -race ./...
